- year: 2026
  items:
  - title: Bayesian deep learning for probabilistic aquifer vulnerability and uncertainty prediction
    authors: <strong>Mengistu, T. D.</strong><sup>*</sup>, Chung, I. M., Kim, M., and Chang, S. W.
    journal: Scientific Reports, 16, 1300
    abbr: Sci. Rep.
    year: 2026
    doi: 10.1038/s41598-025-32612-8
    pdf: /assets/pdf/Mengistu_2026_Bayesian_Aquifer_Vulnerability.pdf
    link: https://doi.org/10.1038/s41598-025-32612-8
    bib: /assets/bib/mengistu2026bayesian.bib
    abstract: Groundwater is the planet’s largest distributed store of freshwater and a critical buffer against drought. Yet aquifers are still managed largely with static, deterministic vulnerability indices that neither capture nonlinear hydrogeological interactions nor convey predictive uncertainty. Accurate and interpretable aquifer vulnerability assessments (AVA) are essential for sustaining groundwater resources under increasing hydro-environmental pressures. This study presents a Bayesian Convolutional Neural Network (Bayesian CNN) framework for probabilistic AVA, integrating prior hydrogeological knowledge through regularization. The model inputs multi-layered hydro-environmental data, learns spatial patterns in contamination occurrence, and outputs full predictive distributions rather than single vulnerability scores. The Bayesian CNN achieved stable convergence, outperformed deterministic deep learning baselines, and produced well-calibrated probabilistic predictions of aquifer vulnerability. Predictive entropy was decomposed into epistemic and aleatoric components, enabling clear attribution of uncertainty to model limitations versus inherent environmental variability. Explainable Artificial Intelligence (XAI) analyses based on SHapley Additive exPlanations (SHAP) identified the dominant vulnerability predictors, reinforcing physical consistency and improving interpretability. By combining Bayesian inference, uncertainty prediction, and XAI, this framework advances adaptive, transparent, and risk-aware sustainable groundwater management. It supports targeted monitoring, resource allocation, and decision-making under uncertainty, providing a scalable pathway toward climate-resilient and evidence-based groundwater governance in data-scarce regions.
  - title: Machine learning for water quality prediction and uncertainty assessment
    authors: <strong>Mengistu, T. D.</strong><sup>*</sup>, Chung, I. M., and Chang, S. W.
    journal: Physics and Chemistry of the Earth, Parts A/B/C, 143, 104319
    abbr: PCE
    year: 2026
    doi: 10.1016/j.pce.2026.104319
    pdf: /assets/pdf/Mengistu_2026_Water_Quality_Machine_Learning.pdf
    link: https://doi.org/10.1016/j.pce.2026.104319
    bib: /assets/bib/mengistu2026waterquality.bib
    abstract: Effective water quality monitoring requires predictive models that combine high accuracy, interpretability, and credible uncertainty quantification. Machine learning (ML) techniques have emerged as powerful tools for predicting water quality and quantifying associated uncertainties. Similarly, Bayesian deep learning (BDL) frameworks enable probabilistic predictions that quantify uncertainties. These approaches can capture nonlinear interactions and provide robust predictions in diverse environmental conditions. This study integrated ensemble ML and BDL to assess the complex relationships between physicochemical parameters and the Water Quality Index (WQI). Six supervised ensemble ML algorithms, namely Decision Tree (DT), Random Forest (RF), Extra Trees (ERT), XGBoost, CatBoost, and LightGBM were evaluated using Bayesian optimisation to identify the optimal hyperparameter configurations. DT achieved the highest predictive accuracy with MAE = 0.657 and 0.428, RMSE = 1.181 and 0.747, MAPE = 10.561 and 7.155, R² = 0.960 and 0.987, and nRMSE = 0.065 and 0.042 for the training and test sets, respectively. The DT outperformed more complex ensemble models, and SHapley Additive exPlanations (SHAP)-based eXplainable Artificial Intelligence (XAI) identified the most influential predictors, aligning model predictions with underlying hydrochemical processes. To capture predictive uncertainty, a probabilistic BDL was developed yielding probabilistic outputs and explicit epistemic uncertainty estimates. ROC analysis confirmed strong performance across WQI classes, with AUC scores of up to 0.90 for WQI classes. The probabilistic approach provides actionable insights for adaptive water quality management, enabling targeted monitoring in areas of high uncertainty and supporting transparent, evidence-based decision-making. These results underscore the value of integrating ML, and Bayesian optimisation to advance robust and adaptive water quality assessment. The proposed workflow provides a scalable framework to enhance monitoring, optimize resources, and advance sustainable water management aligned with the SDGs.
  - title: Enhancing groundwater vulnerability assessment framework under anthropogenic stressors
    authors: <strong>Mengistu, T. D.</strong>, Chung, I. M., and Chang, S. W.
    journal: Scientific Reports
    abbr: Sci. Rep.
    year: 2026
    doi: 10.1038/s41598-026-51372-7
    pdf: /assets/pdf/Mengistu_2026_Enhanced_Groundwater_Vulnerability.pdf
    link: https://doi.org/10.1038/s41598-026-51372-7
    bib: /assets/bib/mengistu2026groundwater.bib
    abstract: Aquifer vulnerability assessment (AVA) is a critical tool for the protection of groundwater-dependent ecosystems, especially in regions under persistent anthropogenic stress. Yet conventional index-based methods often rely on static parameters that inadequately represent dynamic surface–groundwater interactions (SGWI) and evolving land use pressures. This study presents an enhanced AVA framework that integrates physically based SGWI simulations from a coupled SWAT–MODFLOW model with modified DRASTIC indices (DRASTIC, DRASTICL, and DRASTICLW), normalized using a spatially resolved Water Quality Index (WQI). The WQI served as an empirical proxy for contamination, strengthening the link between predicted vulnerability and observed groundwater quality. Key hydrogeological parameters are refined using calibrated SWAT–MODFLOW outputs to improve the representation of recharge, land-surface dynamics, and subsurface responses. The results show that moderate- to high-vulnerability zones dominate the catchment, particularly in cultivated lands and shallow aquifers. Areas with very high vulnerability, though limited, coincide with major water resources and industrial zones, indicating a practical need for targeted management interventions. Model evaluation using ROC analysis indicates improved discrimination performance from DRASTIC to DRASTICLW formulations. The integrated framework provides a physically consistent and empirically constrained approach for regional-scale vulnerability assessment, with applicability dependent on hydrogeological conditions and data availability. Comparative evaluations highlight notable shifts in vulnerability patterns when land use and water quality variables are included, confirming the influence of anthropogenic stressors. By integrating physically based hydrological modeling with empirical water quality data, this approach provides a transferable decision-support framework. It contributes to Sustainable Development Goal 6 (SDG 6) and supports adaptive groundwater management in environmentally sensitive regions.
- year: 2025
  items:
  - title: 'Coupled SWAT-MODFLOW model for assessing watershed responses to groundwater sustainability: A novel ensemble approach'
    authors: <strong>Mengistu, T. D.</strong><sup>*</sup>, Chung, I., Kim, M., and Chang, S. W.
    journal: 'Journal of Hydrology: Regional Studies, 61, 102689'
    abbr: JHRS
    year: 2025
    doi: 10.1016/j.ejrh.2025.102689
    pdf: /assets/pdf/Mengistu_2025_SWAT_MODFLOW_Groundwater_Sustainability.pdf
    link: https://doi.org/10.1016/j.ejrh.2025.102689
    bib: /assets/bib/mengistu2025swatmodflow.bib
    abstract: 'Study Region: Gilgel Gibe Watershed, Omo Gibe River Basin, Ethiopia. Study Focus: Groundwater depletion adversely affects ecosystem health, leading to reduced vegetation cover, changes in habitat suitability, and increased vulnerability to environmental stress. Quantifying groundwater sustainability under surface water-groundwater interactions is crucial for understanding system responses to anthropogenic changes. Hence, the main objective of this study was to quantify groundwater sustainability using a novel ensemble approach of the coupled SWAT-MODFLOW model. The performance of the integrated SWAT-MODFLOW model was assessed using the Parameter Estimation Tool (PEST) with streamflow and aquifer properties, and was found to be in reasonable agreement between the predicted and observed values. New hydrological insights: Annual ensemble values of exploitable amounts of groundwater discharge, minimum desirable flow, and groundwater recharge were used to compute the groundwater footprint and sustainability. The overall basin-wide groundwater footprint was moderately depleted, revealing the need for effective management strategies to mitigate long-term groundwater decline and vulnerability to groundwater droughts. This has resulted in food insecurity due to diminished crop yields and shifting agricultural practices. Overall, this study offers valuable insights for developing informed policy frameworks that prioritise resilient watershed management to support the achievement of sustainable development goals.'
  - title: 'Modeling and prediction of climate change impacts on water resources vulnerability: A multi-model approach'
    authors: <strong>Mengistu, T. D.</strong>, Chang, S. W., and Chung, I. M.
    journal: Journal of Environmental Management, 388, 126025
    abbr: JEM
    year: 2025
    doi: 10.1016/j.jenvman.2025.126025
    pdf: /assets/pdf/Mengistu_2025_Climate_Change_Water_Vulnerability.pdf
    link: https://doi.org/10.1016/j.jenvman.2025.126025
    bib: /assets/bib/mengistu2025climate.bib
    abstract: In a rapidly changing world, uncontrolled climate change worsens water scarcity disrupting hydrological cycles and hindering sustainable development. Addressing water resources vulnerability requires holistic approaches to better understand complex systems, mitigate risks from changing weather patterns, and develop adaptive water management strategies. In this study, we modeled climate change impacts on water resource vulnerability using machine learning (ML) and SWAT model based on CMIP6 Global Climate Model (GCMs) under Shared Socioeconomic Pathway (SSP). Six ML models were evaluated to reliably predict hydroclimatic events; Extremely Randomised Trees (ERT) and Categorical Boosting (CatBoost) performed best for simulating ensemble climate interactions. The statistical indicators confirmed model reliability reducing input uncertainties with bias-corrected datasets. The ensemble SWAT model simulation showed a good agreement between simulated and observed values (R² = 93%, NSE = 91%, and PBIAS = -1.08%) for calibration and (R² = 94%, NSE = 93%, and PBIAS = -2.32%) for validation periods. Furthermore, we developed a novel Hydrologic Vulnerability Index (HVI) framework based on water balance components to quantify watershed vulnerability dynamics across baseline and future scenarios. The HVI ranged from low to extreme, with maximum lower values (54.03%) observed at baseline, indicating resilience to hydrological stress, and higher values indicating severe vulnerability (43.45%) at SSP245, indicating extreme drought conditions. The HVI framework integrates climate projections with actionable insights, offering a comprehensive approach to sustainable water management, adaptive infrastructure, and targeted interventions. Hence, innovative policies are critical to address extreme HVIs ensuring resilience against water scarcity and ecosystem degradation. This study underscores the importance of coupling data-driven hydrological analysis with climate responsiveness for effective watershed and environmental sustainability. These results demonstrate the importance of integrating various perspectives and strategies to address both short- and long-term climatic problems, by employing adaptive management practices to ensure sufficient water and ecosystem resilience.
- year: 2024
  items:
  - title: Quantifying regional low flows under data-scarce conditions
    authors: <strong>Mengistu, T. D.</strong><sup>*</sup>, Chung, I. M., Talpur, Z., and Alemayehu, E.
    journal: Heliyon, 10(7), e28728
    abbr: Heliyon
    year: 2024
    doi: 10.1016/j.heliyon.2024.e28728
    pdf: /assets/pdf/Mengistu_2024_Regional_Low_Flows.pdf
    link: https://doi.org/10.1016/j.heliyon.2024.e28728
    bib: /assets/bib/mengistu2024lowflows.bib
    abstract: Estimating low flow quantiles is essential for regulating minimum flow requirements and ensuring water availability, ecological health, and overall system sustainability. This study aims to quantify regional low flows by analyzing low-flow time series in data-limited environments. We utilized annual minimum 7-day instantaneous streamflow data collected from gaging stations. Discordancy measure assessments revealed that all sites were homogeneous, forming a single region. We employed Easy-Fit Statistical Software to select the best-fit probability distribution model and determine estimation parameter values. Through goodness-of-fit tests (GOFs), the Generalized Pareto model emerged as the most suitable, predicting low flow quantiles for 100-year returns. Rigorous application of GOFs ensures the statistical soundness of the model, capturing underlying data patterns. A correlation coefficient determination (R²) of 0.989 demonstrates the high satisfaction of the selected distribution model. The developed regression line for the region exhibited strong agreement between predicted low flows and catchment area. Thus, accurate estimation proves valuable in environmental and human-influenced decision-making processes, providing insights into low-flow behavior and mitigating drought effects on aquatic ecosystems.
- year: 2023
  items:
  - title: Estimation of crop water productivity using GIS and remote sensing techniques
    authors: Talpur, Z., Zaidi, A. Z., Ahmed, S., <strong>Mengistu, T. D.</strong>, Choi, S. J., and Chung, I. M.
    journal: Sustainability, 15(14), 11154
    abbr: Sustainability
    year: 2023
    doi: 10.3390/su151411154
    pdf: /assets/pdf/Talpur_2023_Crop_Water_Productivity.pdf
    link: https://doi.org/10.3390/su151411154
    bib: /assets/bib/talpur2023crop.bib
    abstract: 'The global demand for food is growing with the population and urbanization, which puts pressure on water resources, which need assessing and quantifying water requirements. Adopting efficient irrigation methods to optimize water use is essential in this situation. In this study, crop water productivity (CWP) of major crops in the Rohri canal command area was estimated by the ratio of yield and actual evapotranspiration (ETa). Analyzing the CWP of major crops, water scarcity challenges can be tackled by selecting the most feasible irrigation methods. However, ETa was calculated and aggregated for all four stages of the crop growth period: initial, crop development, flowering stage, and maturity seasons. The crop yield data were obtained from the districts’ agricultural statistics. For this purpose, evapotranspiration products of Landsat 5 and 8 were downloaded from Earth Engine Evapotranspiration Flux (EEFlux). Landsat images were processed in a GIS environment to calculate ETa. The approach suggests developing a CWP database for major crops like wheat, cotton, and rice to improve irrigation water management. The objectives of this study are to estimate and analyze the difference in the CWP and evapotranspiration of major crops for the Rabi and Kharif seasons with high and moderate flows during 1998–2019. It comprises nine districts of Sindh that come under the Rohri Canal command area. To analyze the difference in CWP between the Rabi and Kharif seasons for all study crops of the seasons of Rabi (2014–2015 and 2016–2017) and Kharif (1998 and 2017). The growing periods for wheat, cotton, and rice in the Rohri Canal command area are 160, 195, and 180 days, respectively. The estimated ETa of the Rohri canal command area and CWP were in good agreement with the literature-reported values. Hence, enhanced agricultural productivity can be achieved by making considerable investments to improve agricultural research and extension systems.'
  - title: Assessment of spatiotemporal groundwater recharge distribution using SWAT-MODFLOW model and transient water table fluctuation method
    authors: Ware, H. H., <strong>Mengistu, T. D.</strong>, Yifru, B. A., Chang, S. W., and Chung, I. M.
    journal: Water, 15(11), 2112
    abbr: Water
    year: 2023
    doi: 10.3390/w15112112
    pdf: /assets/pdf/Ware_2023_Groundwater_Recharge_SWAT_MODFLOW.pdf
    link: https://doi.org/10.3390/w15112112
    bib: /assets/bib/ware2023recharge.bib
    abstract: Recharge is a crucial section of water balance for both surface and subsurface models in water resource assessment. However, quantifying its spatiotemporal distribution at a regional scale poses a significant challenge. Empirical and numerical modeling are the most commonly used methods at the watershed scales. However, integrated models inherently contain a vast number of unknowns and uncertainties, which can limit their accuracy and reliability. In this work, we have proposed integrated SWAT-MODFLOW and Transient Water Table Fluctuation Method (TWTFM) to evaluate the spatiotemporal distribution of groundwater recharge in Anyang watershed, South Korea. Since TWTFM also uses SWAT model percolation output data, calibration was performed for individual models and a coupled model. The coupled model was calibrated using daily streamflow and hydraulic head. The SWAT-MODFLOW model performed well during the simulation of streamflow compared to the SWAT model. The study output showed that the study watershed had significant groundwater recharge variations during the simulated period. A significant amount of recharge happens in the wet season. It contributes a significant amount of the average annual precipitation of the region. The direct flow components (surface and lateral) showed significant contributions when the water balance components were evaluated in the region. TWTFM showed a glimpse to estimate recharge, which requires representative monitoring wells in the study region. Comprehensively, the SWAT-MODFLOW model estimated groundwater recharge with reasonable accuracy in the region.
- year: 2022
  items:
  - title: Impacts and implications of land use land cover dynamics on groundwater recharge and surface runoff in East African watershed
    authors: <strong>Mengistu, T. D.</strong>, Chung, I.-M., Kim, M. G., Chang, S. W., and Lee, J. E.
    journal: Water, 14(13), 2068
    abbr: Water
    year: 2022
    doi: 10.3390/w14132068
    pdf: /assets/pdf/Mengistu_2022_LULC_Groundwater_Recharge.pdf
    link: https://doi.org/10.3390/w14132068
    bib: /assets/bib/mengistu2022lulc.bib
    abstract: Assessing the spatiotemporal dynamics of land use land cover (LULC) change on water resources is vital for watershed sustainability and developing proper management strategies. Evaluating LULC scenarios synergistically with hydrologic modeling affords substantial evidence of factors that govern hydrologic processes. Hence, this study assessed the spatiotemporal effects and implications of LULC dynamics on groundwater recharge and surface runoff in Gilgel Gibe, an East African watershed, using the Soil and Water Assessment Tool (SWAT) model. Three different LULC maps (2000, 2010, and 2020) were derived from Landsat images, and the comparisons pointed out that the land-use pattern had changed significantly. The agricultural land and grassland cover increased by 3.76% and 1.36%, respectively, from 2000 to 2020. The implications acquired for 2000 show that forested land covers decreased by 5.49% in 2020. The SWAT simulation process was executed using a digital elevation model, soil, LULC, and weather data. The model was calibrated and validated using streamflow data to understand the surface runoff and groundwater recharge responses of each Hydrologic Response Units on reference simulation periods using the Calibration and Uncertainty Program (SWAT-CUP), Sequential Uncertainty Fitting (SUFI-2) algorithm. The observed and simulated streamflows were checked for performance indices of coefficient of determination (R²), Nash–Sutcliffe model efficiency (NSE), and percent bias (PBIAS) on monthly time steps. The results show that there is good agreement for all LULC simulations, both calibration and validation periods (R² & NSE ≥ 0.84, -15 < PBIAS < +15). This reveals that for the LULC assessment of any hydrological modeling, the simulation of each reference period should be calibrated to have reasonable outputs. The study indicated that surface runoff has increased while groundwater decreased over the last two decades. The temporal variation revealed that the highest recharge and runoff occurred during the wet seasons. Thus, the study can support maximizing water management strategies and reducing adverse driving environmental forces.
  - title: Determination of potential aquifer recharge zones using geospatial techniques for proxy data of Gilgel Gibe Catchment, Ethiopia
    authors: <strong>Mengistu, T. D.</strong>, Chang, S. W., Kim, I. H., Kim, M. G., and Chung, I. M.
    journal: Water, 14(9), 1362
    abbr: Water
    year: 2022
    doi: 10.3390/w14091362
    pdf: /assets/pdf/Mengistu_2022_Aquifer_Recharge_Zones.pdf
    link: https://doi.org/10.3390/w14091362
    bib: /assets/bib/mengistu2022aquifer.bib
    abstract: 'The lack of valuable baseline information about groundwater availability hinders the robust decision-making process of water management in humid, arid, and semi-arid climate regions of the world. In sustainable groundwater management, identifying the spatiotemporal and extrapolative monitoring of potential zone is crucial. Thus, the present study focused on determining potential aquifer recharge zones using geospatial techniques for proxy data of the Gilgel Gibe catchment, Ethiopia. Proxy data are site information derived from satellite imageries or conventional sources that are operated as a layer attribute in the geographical information system (GIS) to identify groundwater occurrence. First, GIS and analytical hierarchy process (AHP) were applied to analyze ten groundwater recharge controlling factors: slope, lithology, topographic position index lineament density, rainfall, soil, elevation, land use/cover, topographic wetness index, and drainage density. Each layer was given relative rank priority depending on the predictive implication of groundwater potentiality. Next, the normalized weight of thematic layers was evaluated using a multi-criteria decision analysis AHP algorithm with a pairwise comparison matrix based on aquifer infiltration relative significance. Lithology, rainfall, and land use/cover were dominant factors covering a weight of 50%. The computed consistency ratio (CR = 0.092, less than 10%) and consistency index (CI = 0.1371) revealed the reliability of input proxy layers’ in the analysis. Then, a GIS-based weighted overlay analysis was performed to delineate very high, high, moderate, low, and very low potential aquifer zones. The delineated map ensures very high (29%), high (25%), moderate (28%), low (13%), and very low (5%) of the total area. According to validation, most of the inventory wells are located in very high (57%), high (32), and moderate (12%) zones. The validation results realized that the method affords substantial results supportive of sustainable development and groundwater exploitation. Therefore, this study could be a vigorous input to enhance development programs to alleviate water scarcity in the study area.'
  - title: Regional flood frequency analysis for sustainable water resources management of Genale-Dawa River Basin, Ethiopia
    authors: <strong>Mengistu, T. D.</strong>, Feyissa, T. A., Chung, I. M., Chang, S. W., Yesuf, M. B., and Alemayehu, E.
    journal: Water, 14(4), 637
    abbr: Water
    year: 2022
    doi: 10.3390/w14040637
    pdf: /assets/pdf/Mengistu_2022_Regional_Flood_Frequency.pdf
    link: https://doi.org/10.3390/w14040637
    bib: /assets/bib/mengistu2022flood.bib
    abstract: Regional information on stream discharge is needed in order to improve flood estimates based on the limited data availability. Regional flood estimation is fundamental for designing hydraulic structures and managing flood plains and water resource projects. It is essential for estimating flood risks during recurrent periods due to suitable distributions. Regional flood frequency analysis is crucial for evaluating design flows in ungauged basins, and can complement existing time series in gauged sites and transfer them to ungauged catchments. Hence, this study aims to perform a regional flood frequency analysis of the Genale–Dawa River Basin of Ethiopia using the index flood and L-moments approach for sustainable water resource management. Three homogeneous hydrological regions were defined and delineated based on homogeneity tests from data of 16 stream-gauged sites, named Region-A, Region-B, and Region-C. The discordancy index of regional data for L-moment statistics was identified using MATLAB. All regions showed promising results of L-moment statistics with discordance measures (discordance index less than 3) and homogeneity tests (combined coefficient of variation (CC) less than 0.3). L-moment ratio diagrams were used to select best fit probability distributions for areas. Generalized extreme value, log-Pearson type III, and generalized Pareto distributions were identified as suitable distributions for Region-A, Region-B, and Region-C, respectively, for accurately modeling flood flow in the basin. Regional flood frequency curves were constructed, and peak flood was predicted for different return periods. Statistical analysis of the gauged sites revealed an acceptable method of regionalization of the basin. This study confirms that the robustness of the regional L-moments algorithm depends on particular criteria used to measure the performance of estimators. The identified regions should be tested with other physical catchment features to enhance flood quantile estimates at gauged and ungauged sites. Henceforth, this study’s findings can be further extended into flood hazard, risk, and inundation mapping of identified regions of the study area. Furthermore, this study’s approach can be used as a reference for similar investigations of other river basins.
- year: 2021
  items:
  - title: 'Challenges and prospects of advancing groundwater research in Ethiopian aquifers: A review'
    authors: <strong>Mengistu, T. D.</strong>, Chung, I. M., Chang, S. W., Yifru, B. A., Kim, M. G., Lee, J., Ware, H. H., and Kim, I. H.
    journal: Sustainability, 13(20), 11500
    abbr: Sustainability
    year: 2021
    doi: 10.3390/su132011500
    pdf: /assets/pdf/Mengistu_2021_Ethiopian_Aquifers_Review.pdf
    link: https://doi.org/10.3390/su132011500
    bib: /assets/bib/mengistu2021ethiopian.bib
    abstract: Groundwater is a strategic resource in all climatic regions of Ethiopia, contributing about 80% of the domestic supply of urban and rural populations. However, little research has been available compared with extensive geographical coverage and increasing population growth rates. Hence, the present study aimed to review published groundwater research of Ethiopian aquifers to realize potential research challenges and suggest future research directions. We focused on groundwater potential, recharge process, and qualities. The total potential groundwater of the country ranges from 2.5 to 47 billion cubic meters. The study depicted that the mean annual recharge estimate varies from 24.9 mm to 457 mm at catchments scales. However, the overall country was about 39.1 mm. The study found a need for a detailed investigation of different factors susceptible to groundwater pollution, as some of the evaluations indicated exceeding acceptable standards. This study observed that the main challenge was the lack of data and convergence research trends. Henceforth, future research in different climate regions should focus on multifaceted technical and stakeholder settings. This study gives the insight to integrate palatable research findings with the national policy and decision-making process to enhance the sustainability of groundwater resources significantly.
